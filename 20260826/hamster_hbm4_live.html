    --green:#0D9239;
    --amp:1;          /* 모션 세기 */
    --spd:1;          /* 속도 배율 */
    --rail:rgba(4,52,20,.55);
    --line:rgba(255,255,255,.22);
    --mono:ui-monospace,"SF Mono",Menlo,"Cascadia Mono","Roboto Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--green);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    display:flex;flex-direction:column;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- stage ---------- */
  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:min(4vw,28px)}
  .scene{
    position:relative;width:min(100%,620px);aspect-ratio:1100/960;
    transform-origin:50% 94%;
    animation:sway calc(13s / var(--spd)) ease-in-out infinite;
  }
  .layer{position:absolute;inset:0;background-image:var(--art);background-size:100% 100%;background-repeat:no-repeat}

  .body{
    transform-origin:50% 94%;
    animation:breathe calc(4.4s / var(--spd)) ease-in-out infinite;
  }
  .head{
    position:absolute;inset:0;
    -webkit-mask-image:radial-gradient(ellipse 19% 20% at 48.9% 18.6%, #000 52%, rgba(0,0,0,0) 80%);
            mask-image:radial-gradient(ellipse 19% 20% at 48.9% 18.6%, #000 52%, rgba(0,0,0,0) 80%);
    animation:breathe calc(4.4s / var(--spd)) ease-in-out infinite,
              bob calc(4.4s / var(--spd)) ease-in-out infinite;
    transform-origin:50% 94%;
  }

  /* ---------- 눈 깜빡임 ---------- */
  .eye{
    position:absolute;border-radius:50%;
    background:linear-gradient(#E9A468 0%,#E09054 62%,#D2854C 100%);
    box-shadow:inset 0 -3px 0 rgba(74,46,32,.85);
    transform-origin:50% 0%;transform:scaleY(0);
    filter:blur(.4px);
    animation:blink calc(7.2s / var(--spd)) ease-in-out infinite;
  }
  .eye.l{left:41.3%;top:15.0%;width:4.5%;height:5.9%}
  .eye.r{left:52.3%;top:15.0%;width:4.9%;height:5.9%}
  .eye.r{animation-delay:.04s}
  body.no-blink .eye{animation:none;transform:scaleY(0)}

  /* ---------- 칩이 살아있다 ---------- */
  .die{
    position:absolute;left:38.5%;top:37.2%;width:22%;height:20.5%;
    border-radius:8%;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,196,110,.62), rgba(255,150,60,.16) 58%, rgba(255,140,40,0) 74%);
    mix-blend-mode:screen;filter:blur(9px);opacity:.5;
    animation:pulse calc(3.1s / var(--spd)) ease-in-out infinite;
  }
  .trace{
    position:absolute;left:34.2%;top:32.0%;width:32.3%;height:30.3%;
    overflow:hidden;mix-blend-mode:screen;opacity:.5;border-radius:2%;
  }
  .trace::after{
    content:"";position:absolute;inset:-30% -60%;
    background:linear-gradient(105deg,rgba(255,190,110,0) 42%,rgba(255,208,140,.55) 50%,rgba(255,190,110,0) 58%);
    animation:sweep calc(6.5s / var(--spd)) linear infinite;
  }
  body.no-glow .die,body.no-glow .trace{display:none}

  .spark{
    position:absolute;left:85.2%;top:83.6%;width:6.5%;height:7.4%;
    background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 62%);
    opacity:0;animation:twinkle calc(5.4s / var(--spd)) ease-in-out infinite;
  }

  /* ---------- keyframes ---------- */
  @keyframes breathe{
    0%,100%{transform:scale(1)}
    50%{transform:scale(calc(1 + .007 * var(--amp)))}
  }
  @keyframes bob{
    0%,100%{translate:0 calc(.9px * var(--amp));rotate:calc(-.22deg * var(--amp))}
    42%{translate:calc(.6px * var(--amp)) calc(-3.4px * var(--amp));rotate:calc(.28deg * var(--amp))}
    70%{translate:calc(-.4px * var(--amp)) calc(-1.2px * var(--amp));rotate:calc(-.05deg * var(--amp))}
  }
  @keyframes sway{
    0%,100%{rotate:calc(-.35deg * var(--amp));translate:0 0}
    50%{rotate:calc(.35deg * var(--amp));translate:0 calc(-3px * var(--amp))}
  }
  @keyframes blink{
    0%,88%{transform:scaleY(0)}
    91%{transform:scaleY(1)}
    93.5%{transform:scaleY(1)}
    96.5%,100%{transform:scaleY(0)}
  }
  @keyframes pulse{
    0%,100%{opacity:.28}
    50%{opacity:.72}
  }
  @keyframes sweep{
    0%{transform:translateX(-55%)}
    55%,100%{transform:translateX(85%)}
  }
  @keyframes twinkle{
    0%,72%,100%{opacity:0;transform:scale(.6)}
    82%{opacity:.85;transform:scale(1.15)}
    90%{opacity:.2;transform:scale(.9)}
  }

  /* ---------- 컨트롤 레일 ---------- */
  .rail{
    background:var(--rail);
    border-top:1px solid var(--line);
    backdrop-filter:blur(8px);
    padding:14px max(14px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
  }
  .grp{display:flex;gap:6px;align-items:center}
  .lbl{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    color:rgba(255,255,255,.62);text-transform:uppercase;margin-right:2px;
  }
  button{
    font-family:var(--mono);font-size:12px;letter-spacing:.03em;
    color:rgba(255,255,255,.8);
    background:rgba(255,255,255,.07);
    border:1px solid var(--line);
    border-radius:999px;padding:8px 14px;cursor:pointer;
    transition:background .16s ease,color .16s ease,border-color .16s ease;
  }
  button:hover{background:rgba(255,255,255,.14)}
  button[aria-pressed="true"]{
    background:#fff;color:#0A6B2A;border-color:#fff;font-weight:600;
  }
  button:focus-visible{outline:2px solid #FFD9A0;outline-offset:2px}

  @media (prefers-reduced-motion:reduce){
    .scene,.body,.head,.eye,.die,.trace::after,.spark{animation:none!important}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="scene" role="img" aria-label="방진복을 입고 HBM4 DRAM을 든 햄스터, 은은하게 숨쉬는 애니메이션">
      <div class="layer body"></div>
      <div class="head">
        <div class="layer"></div>
        <div class="eye l"></div>
        <div class="eye r"></div>
      </div>
      <div class="die"></div>
      <div class="trace"></div>
      <div class="spark"></div>
    </div>
  </div>

  <div class="rail">
    <div class="grp">
      <span class="lbl">움직임</span>
      <button data-amp="0.55">약</button>
      <button data-amp="1" aria-pressed="true">보통</button>
      <button data-amp="1.8">강</button>
    </div>
    <div class="grp">
      <span class="lbl">속도</span>
      <button data-spd="0.7">느리게</button>
      <button data-spd="1" aria-pressed="true">기본</button>
      <button data-spd="1.4">빠르게</button>
    </div>
    <div class="grp">
      <button id="blink" aria-pressed="true">눈 깜빡임</button>
      <button id="glow" aria-pressed="true">칩 글로우</button>
    </div>
  </div>

<script>
  const root = document.documentElement;
  const setGroup = (attr, cssVar) => {
    document.querySelectorAll(`button[data-${attr}]`).forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll(`button[data-${attr}]`).forEach(o => o.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        root.style.setProperty(cssVar, b.dataset[attr]);
      });
    });
  };
  setGroup('amp', '--amp');
  setGroup('spd', '--spd');

  const toggle = (id, cls) => {
    const b = document.getElementById(id);
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', String(!on));
      document.body.classList.toggle(cls, on);
    });
  };
  toggle('blink', 'no-blink');
  toggle('glow', 'no-glow');
</script>
</body>
</html>
