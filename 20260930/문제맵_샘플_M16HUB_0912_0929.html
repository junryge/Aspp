function home(){zoom=1;px=(W-40-(maxx-minx)*base)/2;py=(H-40-(maxy-miny)*base)/2;draw();}
function focus(zid){const z=Z[ZI[zid]];if(!z||z.cx==null)return;zoom=Math.max(zoom,4);const s=base*zoom;px=W/2-20-(z.cx-minx)*s;py=H/2-20-(z.cy-miny)*s;draw();}
// ---------- 색 ----------
let mode='sum', cur=null, selZone=null, ev=null, evRows=[], k=0, timer=null;
const maxScore=Math.max(1,...D.table.map(d=>d.c[2]*3+d.c[1]*2+d.c[0]));
function heat(v){const t=Math.min(1,v/maxScore);const a=css('--l1'),b=css('--l3');return mix(a,b,t);}
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function zoneStyle(){ // 구역 id → [색, 굵기, 순위]
 const m={};
 if(cur){[[cur[2],1],[cur[3],2],[cur[4],3]].forEach(([z,r])=>{if(z&&z!=='0'&&!(z in m))m[z]=r===1?[css('--l'+cur[1]),5,1]:[css('--sub'),3.2,r];});}
 else{D.table.forEach(d=>{const sc=d.c[2]*3+d.c[1]*2+d.c[0];if(sc>0)m[d.id]=[heat(sc),2.5+4*Math.min(1,sc/maxScore),1];else if(d.sub>0)m[d.id]=[css('--sub'),2,3];});}
 return m;}
function draw(){
 ctx.clearRect(0,0,W,H);const rail=css('--rail'),zc=css('--zone');const st=zoneStyle();
 const lw=Math.max(.6,Math.min(2,.5+zoom*.15));
 ctx.lineCap='round';
 // 레일
 ctx.strokeStyle=rail;ctx.lineWidth=lw;ctx.beginPath();
 for(let i=0;i<G.e.length;i+=3){if(G.e[i+2]>=0)continue;const a=S(G.x[G.e[i]],G.y[G.e[i]]),b=S(G.x[G.e[i+1]],G.y[G.e[i+1]]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}
 ctx.stroke();
 // 구역 (칠하지 않는 구역은 조금 진한 회색)
 ctx.strokeStyle=zc;ctx.lineWidth=lw;ctx.beginPath();
 for(let i=0;i<G.e.length;i+=3){const z=G.e[i+2];if(z<0||st[Z[z].id])continue;const a=S(G.x[G.e[i]],G.y[G.e[i]]),b=S(G.x[G.e[i+1]],G.y[G.e[i+1]]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}
 ctx.stroke();
 // 문제 구역 — 2·3위 먼저, 1위 나중
 const order=Object.entries(st).sort((a,b)=>b[1][2]-a[1][2]);
 for(const [zid,[col,w]] of order){const zi=ZI[zid];if(zi==null)continue;ctx.strokeStyle=col;ctx.lineWidth=w*(selZone===zid?1.6:1);ctx.beginPath();
  for(let i=0;i<G.e.length;i+=3){if(G.e[i+2]!==zi)continue;const a=S(G.x[G.e[i]],G.y[G.e[i]]),b=S(G.x[G.e[i+1]],G.y[G.e[i+1]]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}ctx.stroke();}
 // 라벨
 ctx.font='600 11px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 const placed=[];const TR={};D.table.forEach((d,i)=>TR[d.id]=i);
 const rank=z=>{const s=st[z.id];return selZone===z.id?-1:!s?1e6:cur?s[2]:(TR[z.id]??1e5);};   // 표 순위대로 라벨 (겹치면 뒤 순위를 뺀다)
 [...Z].sort((a,b)=>rank(a)-rank(b)).forEach(z=>{if(z.cx==null)return;const s=st[z.id];if(!s&&zoom<3&&selZone!==z.id)return;let [x,y]=S(z.cx,z.cy);if(x<-20||y<-20||x>W+20||y>H+20)return;
  const nm=z.bay?` · ${z.bay}`:'';const t=s&&s[2]===1&&cur?`HID ${z.id}${nm} ${LV[cur[1]]}`:(s||selZone===z.id?`HID ${z.id}${nm}`:z.id);const w=ctx.measureText(t).width+8;
  const x0=x;x=Math.max(w/2+2,Math.min(W-w/2-2,x0));
  if(placed.some(p=>Math.abs(p[0]-x)<(p[2]+w)/2&&Math.abs(p[1]-y)<16))return;placed.push([x,y,w]);  // 겹치면 순위 낮은 라벨은 뺀다 (확대하면 보임)
  ctx.fillStyle=s?css('--panel'):'transparent';if(s){ctx.globalAlpha=.85;ctx.fillRect(x-w/2,y-8,w,16);ctx.globalAlpha=1;}
  ctx.fillStyle=s?css('--fg'):css('--fg2');ctx.fillText(t,x,y);});
 legend();}
function legend(){
 if(cur)$('lg').innerHTML=`<b>${cur[0]}</b><i style="background:${css('--l'+cur[1])}"></i>1위 구역 (${LV[cur[1]]})<i style="background:${css('--sub')}"></i>2·3위 구역`;
 else $('lg').innerHTML=`누적 — 병목 1위로 나온 정도<i style="background:${css('--l1')}"></i>적음<i style="background:${css('--l3')}"></i>많음<i style="background:${css('--sub')}"></i>2·3위로만`;}
// ---------- 지도 조작 ----------
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px,py,moved:false};cv.setPointerCapture(e.pointerId);cv.classList.add('drag');});
cv.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;px=drag.px+dx;py=drag.py+dy;draw();}else hover(e);});
cv.addEventListener('pointerup',e=>{cv.classList.remove('drag');if(drag&&!drag.moved){const z=pick(e);if(z){selZone=z;markRow(z);draw();}}drag=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;const [wx,wy]=I(mx,my);
 zoom=Math.max(.5,Math.min(80,zoom*(e.deltaY<0?1.2:1/1.2)));const [sx,sy]=S(wx,wy);px+=mx-sx;py+=my-sy;draw();},{passive:false});
cv.addEventListener('dblclick',home);
function pick(e){const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=14*14;
 for(let i=0;i<G.e.length;i+=3){const z=G.e[i+2];if(z<0)continue;const a=S(G.x[G.e[i]],G.y[G.e[i]]),b=S(G.x[G.e[i+1]],G.y[G.e[i+1]]);const d=seg(mx,my,a,b);if(d<bd){bd=d;best=Z[z].id;}}return best;}
function seg(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((x-a[0])*dx+(y-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));const qx=a[0]+t*dx-x,qy=a[1]+t*dy-y;return qx*qx+qy*qy;}
function hover(e){const z=pick(e),tp=$('tip');if(!z){tp.style.display='none';return;}const r=cv.getBoundingClientRect(),zz=Z[ZI[z]],d=TB[z];
 tp.innerHTML=`<b>HID ${z}</b> ${zz.name||''} ${zz.bay?'· '+zz.bay:''}<br>`+(d?`1위 경계 ${d.c[0]} · 위험 ${d.c[1]} · 초위험 ${d.c[2]}분 · 2·3위 ${d.sub}분 · 사건 ${d.ev}`:'알람 없음');
 tp.style.display='block';tp.style.left=Math.min(e.clientX-r.left+12,W-260)+'px';tp.style.top=(e.clientY-r.top+12)+'px';}
// ---------- 오른쪽 표 ----------
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));});
const badge=l=>l?`<span class="b b${l}">${LV[l]}</span>`:'';
function zoneTable(){
 const miss=D.table.filter(d=>!d.map);
 let h=`<div class="note">기간 동안 <b>병목 1위(HID_ZONE)</b>로 나온 분 수 — 초위험×3 + 위험×2 + 경계 순. 줄을 누르면 지도에서 그 구역으로 갑니다.</div>`;
 if(miss.length)h+=`<div class="warn">지도에 없는 구역 ${miss.length}개: ${miss.slice(0,12).map(d=>d.id).join(', ')}${miss.length>12?' …':''} — 결과 파일과 OHT_MAP 마스터가 다른지 확인하세요.</div>`;
 h+=`<table><thead><tr><th>#</th><th class="l">HID</th><th class="l">구역</th><th>경계</th><th>위험</th><th>초위험</th><th>2·3위</th><th>사건</th></tr></thead><tbody>`;
 D.table.forEach((d,i)=>{h+=`<tr data-z="${d.id}"><td>${i+1}</td><td class="l"><b>${d.id}</b>${d.map?'':' ⚠'}</td><td class="l">${(d.bay||'')}</td><td>${d.c[0]||''}</td><td>${d.c[1]||''}</td><td>${d.c[2]||''}</td><td>${d.sub||''}</td><td>${d.ev||''}</td></tr>`;});
 if(!D.table.length)h+=`<tr><td colspan="8" class="l">이 기간 알람 없음</td></tr>`;
 $('pz').innerHTML=h+'</tbody></table>';
 $('pz').querySelectorAll('tbody tr[data-z]').forEach(tr=>tr.onclick=()=>{selZone=tr.dataset.z;markRow(selZone);focus(selZone);});}
function markRow(z){document.querySelectorAll('#pz tr[data-z]').forEach(tr=>tr.classList.toggle('sel',tr.dataset.z===z));}
function eventTable(){
 let h=`<div class="note">알람이 이어진 분을 한 사건으로 묶었습니다 (사이가 ${1}분 넘게 벌어지면 다른 사건). 누르면 그 사건을 분마다 지도에서 봅니다.</div>`;
 h+=`<table><thead><tr><th class="l">시작</th><th>끝</th><th>분</th><th>최고</th><th class="l">시작 HID</th><th class="l">최다 HID</th></tr></thead><tbody>`;
 D.events.forEach((e,i)=>{h+=`<tr data-i="${i}"><td class="l">${e.s.slice(5)}</td><td>${e.e.slice(11)}</td><td>${e.min}</td><td>${badge(e.lv)}</td><td class="l">${e.z0}</td><td class="l">${e.ztop}</td></tr>`;});
 if(!D.events.length)h+=`<tr><td colspan="6" class="l">이 기간 알람 없음</td></tr>`;
 $('pe').innerHTML=h+'</tbody></table>';
 $('pe').querySelectorAll('tbody tr[data-i]').forEach(tr=>tr.onclick=()=>{$('pe').querySelectorAll('tr').forEach(x=>x.classList.toggle('sel',x===tr));openEvent(+tr.dataset.i);});}
function openEvent(i){ev=D.events[i];evRows=D.rows.filter(r=>r[0]>=ev.s&&r[0]<=ev.e);k=0;$('sl').max=evRows.length-1;$('sl').value=0;$('play').classList.add('on');mode='ev';$('bt-mode').textContent='누적 보기';show(0,true);}
function show(j,center){k=j;cur=evRows[j];$('sl').value=j;$('pt').textContent=`${j+1} / ${evRows.length}분`;
 const r=cur;$('kv').innerHTML=`<b>시간</b><span>${r[0]}</span><b>ALARM</b><span>${badge(r[1])}</span>
 <b>HID_ZONE</b><span>${r[2]}</span><b>section</b><span>${r[13]}</span><b>2·3위</b><span>${r[3]} · ${r[4]}</span><b>report</b><span>${r[5]}</span>
 <b>missing</b><span>${r[6]}</span><b>JAM</b><span>${r[7]}</span><b>HT_STOP</b><span>${r[8]}</span><b>ZONE_STOP</b><span>${r[9]}</span>
 <b>ZONE_VHL</b><span>${r[10]}</span><b>점유율</b><span>${r[12]}%</span>`;
 if(center&&r[2]!=='0')focus(r[2]);else draw();}
$('sl').oninput=e=>show(+e.target.value);
$('bp').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('bp').textContent='▶';return;}$('bp').textContent='❚❚';
 timer=setInterval(()=>{if(k>=evRows.length-1){clearInterval(timer);timer=null;$('bp').textContent='▶';return;}show(k+1);},700);};
$('bx').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('bp').textContent='▶';}$('play').classList.remove('on');cur=null;ev=null;mode='sum';draw();};
$('bt-mode').onclick=()=>{if(cur){cur=null;$('bt-mode').textContent=ev?'사건 보기':'누적 보기';}else if(ev){cur=evRows[k];$('bt-mode').textContent='누적 보기';}draw();};
$('bt-all').onclick=home;
$('pi').innerHTML=`<div class="note" style="font-size:12.5px;line-height:1.6">
<b>무엇인가</b><br>HID_병목구간.py 결과(1분마다 ALARM · 병목 1위 HID_ZONE · 2·3위)를 월드모델파생 맵(OHT_MAP 레이아웃 · HID_Zone_Master) 위에 칠한 것입니다. 구역 번호는 HID_병목구간.py 와 같은 방법으로 붙였습니다(${D.info.use}).<br><br>
<b>누적 보기</b> — 기간 동안 병목 1위로 나온 구역일수록 진한 색 · 굵은 선. 2·3위로만 나온 구역은 파란 선.<br>
<b>사건 보기</b> — '알람 사건'에서 사건을 누르면 분마다 1위 구역을 ALARM 색(경계 · 위험 · 초위험)으로, 2·3위 구역을 파란색으로 보여 줍니다. ▶ 로 넘겨 보면 막힘이 어디서 어디로 번지는지 보입니다.<br><br>
<b>조작</b> — 휠 확대 · 드래그 이동 · 더블클릭 전체 · 구역 위에 마우스를 올리면 집계, 누르면 표에서 표시.<br><br>
<b>맵</b> ${D.info.layout} · ${D.info.msg}<br><b>결과 번호 일치</b> ${D.info.match}</div>`;
zoneTable();eventTable();
addEventListener('resize',()=>{fit();draw();});fit();home();
</script></body></html>
