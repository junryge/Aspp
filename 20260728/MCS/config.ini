; ============================================
; M16A MCS 운영 Oracle 접속 정보
; ============================================
[oracle]
; RAC 노드 (Primary 2 + DR 2) - 콤마로 구분, 순서대로 FAILOVER
hosts       = 10.30.11.133, 10.30.11.134, 10.30.11.138, 10.30.11.139
port        = 1521
service_name = M16MCSPP
user        = mcsread
password    = Mcsreadadmin123!

; FAILOVER 설정
failover      = on
failover_type = SELECT
method        = BASIC
retries       = 5
delay         = 5

[query]
; 기본 조회 조건
message_name = UI-UNIT-PORT-MAXCAPACITY-UPDATE
; 기본 조회 시작시각 (비우면 전체 조회)
from_time    = 2026-07-27 00:00:00
to_time      =
; 0 이면 제한 없음
limit        = 1000
; 결과 저장 경로 (비우면 저장 안함)
csv_path     = result.csv
